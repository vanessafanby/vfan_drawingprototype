<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketch the Sound</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  </head>

  <body>
    <div id="popup">
      <div class="popup-box">
        <p>
          As you draw on the canvas, audio will be generated, so make sure your
          sound is turned ON!<br /><br />
          Have fun!
        </p>

        <button id="okBtn">OK</button>
      </div>
    </div>

    <div class="app">
      <aside class="panel">
        <h1>Sketch the Sound</h1>

        <button id="audioBtn" class="primary">Sound ON</button>

        <section class="group">
          <h2>Brush Tool</h2>
          <div class="row">
            <button class="tool-btn active" data-tool="pen">Pen 🖋️</button>
            <button class="tool-btn" data-tool="soft">Soft Brush 🖌️</button>
          </div>
        </section>

        <section class="group">
          <h2>Colour</h2>
          <input id="colorPicker" type="color" value="#7ea8bf" />
        </section>

        <section class="group">
          <h2>Brush Size</h2>
          <input id="sizeSlider" type="range" min="1" max="28" value="10" />
          <p class="mini-note">
            <br />Thin = Flute <br /><br />Medium = Piano<br />
            <br />Thick = Guitar<br />
          </p>
        </section>

        <section class="group">
          <h2>Canvas</h2>
          <div class="row">
            <button id="undoBtn">↩</button>
            <button id="redoBtn">↪</button>
            <button id="clearBtn">Clear</button>
          </div>
        </section>

        <p class="note">
          <!-- Press Start Sound, choose a brush, then doodle freely on the canvas. -->
        </p>
      </aside>

      <main class="canvas-wrap">
        <div id="stage-container"></div>

        <div class="echo-panel">
          <div class="echo-top">
            <span id="recordDot" class="record-dot"></span>
            <span id="recordingStatus">Echo ready</span>
          </div>

          <div class="progress-track">
            <div id="loopProgress" class="progress-fill"></div>
          </div>

          <div class="echo-buttons">
            <button id="toggleLoopBtn">Begin Echo</button>
            <button id="clearLoopBtn">Clear Echo</button>
          </div>
        </div>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>

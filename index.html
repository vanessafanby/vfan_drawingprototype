<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sketch the Sound</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  

  <body>
    <!-- POPUP -->
    <div id="popup">
      <div class="popup-box">
        <p>
          Welcome to Sketchy Sketch Sound!<br /><br />

          Draw freely on the canvas and create sound through movement.<br />
          Different sound brushes create different instruments.<br /><br />

          Have fun exploring ✨
        </p>

        <button id="okBtn">Enter</button>
      </div>
    </div>

    <div class="app">
      <!-- LEFT PANEL -->
      <aside class="panel">
        <h1>Sketchy Sketch Sound!</h1>

        <!-- BRUSH -->
        <section class="group">
          <h2>Brush Tool</h2>

          <div class="row">
            <button class="tool-btn active" data-tool="pen">Pen 🖋️</button>

            <button class="tool-btn" data-tool="soft">Soft Brush 🖌️</button>
          </div>
        </section>

        <!-- COLOUR -->
        <section class="group">
          <h2>Colour</h2>

          <input id="colorPicker" type="color" value="#7ea8bf" />
        </section>

        <!-- INSTRUMENT -->
        <section class="group">
          <h2>Instrument Brush</h2>

          <div class="brush-size-row">
            <button class="size-btn active" data-size="small">
              <span class="dot small-dot"></span>

              Flute
            </button>

            <button class="size-btn" data-size="medium">
              <span class="dot medium-dot"></span>

              Piano
            </button>

            <button class="size-btn" data-size="large">
              <span class="dot large-dot"></span>

              Guitar
            </button>
          </div>
        </section>

        <!-- SCALE -->
        <section class="group">
          <h2>Scale / Key</h2>

          <select id="scaleSelect">
            <option value="pentatonic">Pentatonic</option>

            <option value="major">Major</option>

            <option value="minor">Minor</option>
          </select>
        </section>

        <!-- VOLUME -->
        <section class="group">
          <h2>Volume</h2>

          <input id="volumeSlider" type="range" min="-20" max="5" value="-6" />
        </section>

        <!-- CANVAS -->
        <section class="group">
          <h2>Canvas</h2>

          <div class="row">
            <button id="undoBtn">↩</button>

            <button id="redoBtn">↪</button>

            <button id="clearBtn">Clear</button>
          </div>
        </section>

        <!-- EXPORT -->
        <section class="group">
          <h2>Export</h2>

          <button id="exportBtn">Save Artwork ✨</button>
        </section>
      </aside>

      <!-- CANVAS -->
      <main class="canvas-wrap">
        <div id="stage-container"></div>

        <!-- LOOP PANEL -->
        <div class="echo-panel">
          <div class="echo-top">
            <span id="recordDot" class="record-dot"></span>

            <span id="recordingStatus"> Echo ready </span>
          </div>

          <div class="progress-track">
            <div id="loopProgress" class="progress-fill"></div>
          </div>

          <div class="echo-buttons">
            <button id="toggleLoopBtn">Begin Echo</button>

            <button id="clearLoopBtn">Clear Echo</button>
          </div>
        </div>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
